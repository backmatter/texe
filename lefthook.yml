# Conventional commits without a Node toolchain (same rule as commitlint's config-conventional).
commit-msg:
  jobs:
    - name: conventional commit message
      run: head -n1 {1} | grep -qE '^(Merge |Revert |fixup! |squash! |(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+)' || { echo "Use a conventional commit message, e.g. 'fix(build): handle missing lock'"; exit 1; }
