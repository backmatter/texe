name: Native installer checks

on:
  push:
    branches:
      - codex/native-welcome
    paths:
      - .github/workflows/native-packaging.yml
      - scripts/package-macos-app.sh
      - scripts/package-windows-app.ps1
      - packaging/macos/**
      - packaging/windows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned suite metadata
        id: metadata
        shell: bash
        run: |
          echo "revision=$(cargo xtask pqty revision)" >> "$GITHUB_OUTPUT"
          version="$(cargo pkgid --package texe | sed -E 's/.*[@#]([^@#]+)$/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backmatter/pqty
          ref: ${{ steps.metadata.outputs.revision }}
          path: pqty
          persist-credentials: false

      - name: Build and assemble the current command suite
        shell: bash
        run: |
          cargo build --locked --package texe
          cargo build --locked --workspace --manifest-path pqty/Cargo.toml
          mkdir -p "$RUNNER_TEMP/native-app-suite"
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          cp "target/debug/texe$suffix" "$RUNNER_TEMP/native-app-suite/"
          cp "pqty/target/debug/pqty$suffix" "$RUNNER_TEMP/native-app-suite/"
          cp "pqty/target/debug/pqty-fls$suffix" "$RUNNER_TEMP/native-app-suite/"

      - name: Package and test the Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./scripts/package-macos-app.sh "$RUNNER_TEMP/native-app-suite" \
            "$RUNNER_TEMP/texe-test.dmg" "${{ steps.metadata.outputs.version }}"

      - name: Package, install, and uninstall the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows-app.ps1 -SuiteBin "$env:RUNNER_TEMP/native-app-suite" `
            -OutputDir "$env:RUNNER_TEMP/native-app-output" `
            -Version "${{ steps.metadata.outputs.version }}" -TestInstall
