name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-latest
          - platform: Windows x86-64
            os: windows-2025
          - platform: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Verify release architecture
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            "Linux x86-64") [[ "$(uname -s):$(uname -m)" == "Linux:x86_64" ]] ;;
            "Windows x86-64") [[ "$PROCESSOR_ARCHITECTURE" == "AMD64" ]] ;;
            "macOS Apple Silicon") [[ "$(uname -s):$(uname -m)" == "Darwin:arm64" ]] ;;
          esac

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Compile native macOS welcome app
        if: runner.os == 'macOS'
        run: >-
          xcrun swiftc -swift-version 5 -warnings-as-errors -target arm64-apple-macos12.0
          -framework AppKit desktop/macos/main.swift -o "${{ runner.temp }}/texe-desktop"

      - name: Compile and check native Windows welcome app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $app = Join-Path $env:RUNNER_TEMP 'texe-desktop.exe'
          & $compiler /nologo /warnaserror /codepage:65001 /target:winexe /platform:x64 "/out:$app" `
            /win32manifest:desktop/windows/app.manifest `
            /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Core.dll `
            desktop/windows/Welcome.cs
          if ($LASTEXITCODE -ne 0) { throw 'Welcome app compilation failed' }
          $process = Start-Process -FilePath $app -ArgumentList '--test-quoting' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Welcome app argument tests failed' }

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
        run: cargo doc --workspace --no-deps --locked

  vscode-extension:
    name: VS Code companion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run mocked extension-host tests
        run: node --test tests/*.test.js

  vscode-real:
    name: Real VS Code paper workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TEXE_TEST_MANAGED: "1"
      TEXE_TEST_SUITE: ${{ github.workspace }}/target/release
    steps:
      - name: Check out texe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned pqty revision
        id: suite
        run: |
          revision="$(cargo xtask pqty revision)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out pinned pqty
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/pqty
          ref: ${{ steps.suite.outputs.revision }}
          path: pqty
          persist-credentials: false
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build the command suite
        run: |
          cargo build --release --locked
          cargo build --release --manifest-path pqty/Cargo.toml --workspace --locked
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          cp "pqty/target/release/pqty${suffix}" "pqty/target/release/pqty-fls${suffix}" target/release/
      - name: Install test harness
        run: npm ci --prefix tests/vscode --ignore-scripts
      - name: Exercise real editor, PDF viewer and SyncTeX
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm test --prefix tests/vscode
          else
            npm test --prefix tests/vscode
          fi
      - name: Retain editor screenshots and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-workflow-evidence-${{ matrix.os }}
          path: |
            ${{ env.TEXE_EDITOR_EVIDENCE }}/*.png
            ${{ env.TEXE_EDITOR_EVIDENCE }}/results.json
            ${{ env.TEXE_EDITOR_EVIDENCE }}/*.synctex.gz
            ${{ env.TEXE_EDITOR_EVIDENCE }}/profile/logs/**
          if-no-files-found: ignore
          retention-days: 7

  managed-journey:
    name: Managed user journey (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            os: ubuntu-latest
          - platform: Windows x86-64
            os: windows-2025
          - platform: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Check out texe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned pqty revision
        id: suite
        shell: bash
        run: |
          revision="$(cargo xtask pqty revision)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out pinned pqty
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/pqty
          ref: ${{ steps.suite.outputs.revision }}
          path: pqty
          persist-credentials: false

      - name: Verify release architecture
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            "Linux x86-64") [[ "$(uname -s):$(uname -m)" == "Linux:x86_64" ]] ;;
            "Windows x86-64") [[ "$PROCESSOR_ARCHITECTURE" == "AMD64" ]] ;;
            "macOS Apple Silicon") [[ "$(uname -s):$(uname -m)" == "Darwin:arm64" ]] ;;
          esac

      - name: Run local command-suite contracts
        env:
          PQTY_REPO: ${{ github.workspace }}/pqty
        run: cargo xtask verify contracts

      - name: Run the clean managed journey
        env:
          PQTY_REPO: ${{ github.workspace }}/pqty
        run: cargo xtask verify platform

  dependency-policy:
    name: Dependency security, licenses, and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.89.0"
