name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release metadata
        id: release
        shell: bash
        run: |
          version="$(cargo pkgid --package texe | sed -E 's/.*[@#]([^@#]+)$/\1/')"
          tag="v$version"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]]
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify crates.io package
        run: cargo publish --dry-run --package texe --locked

  suite:
    name: Suite (${{ matrix.platform }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-24.04
            archive: texe-x86_64-linux.tar.gz
          - platform: x86_64-windows
            os: windows-2025
            archive: texe-x86_64-windows.zip
          - platform: aarch64-macos
            os: macos-15
            archive: texe-aarch64-macos.tar.gz

    steps:
      - name: Check out texe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned pqty revision
        id: suite
        shell: bash
        run: |
          revision="$(sed -n 's/^pqty_revision = "\\([^"]*\\)"/\\1/p' suite.lock.toml)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out pinned pqty
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/pqty
          ref: ${{ steps.suite.outputs.revision }}
          path: pqty
          persist-credentials: false

      - name: Build portable command suite
        env:
          PQTY_REPO: ${{ github.workspace }}/pqty
        run: cargo xtask package suite "dist/${{ matrix.archive }}"

      - name: Extract portable command suite
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-suite"
          case "${{ matrix.platform }}" in
            x86_64-windows) unzip -q "dist/${{ matrix.archive }}" -d "$RUNNER_TEMP/native-suite" ;;
            *) tar -C "$RUNNER_TEMP/native-suite" -xzf "dist/${{ matrix.archive }}" ;;
          esac

      - name: Run the installed-suite journey
        env:
          PQTY_REPO: ${{ github.workspace }}/pqty
        run: >-
          cargo xtask verify platform --suite-bin
          "${{ runner.temp }}/native-suite/texe-${{ matrix.platform }}/bin"

      - name: Build Linux package
        if: matrix.platform == 'x86_64-linux'
        run: >-
          cargo xtask package deb
          --suite-bin "${{ runner.temp }}/native-suite/texe-x86_64-linux/bin"
          --output "dist/texe_${{ needs.metadata.outputs.version }}_amd64.deb"
          --version "${{ needs.metadata.outputs.version }}"

      - name: Test Linux user-local installer and uninstaller
        if: matrix.platform == 'x86_64-linux'
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/texe-installed"
          ./scripts/install.sh \
            --from "dist/${{ matrix.archive }}" \
            --prefix "$prefix"
          for command in texe pqty pqty-fls; do
            "$prefix/bin/$command" --version
          done
          ./scripts/uninstall.sh --prefix "$prefix"
          for command in texe pqty pqty-fls; do
            test ! -e "$prefix/bin/$command"
          done

      - name: Install and smoke-test Linux package
        if: matrix.platform == 'x86_64-linux'
        shell: bash
        run: |
          sudo dpkg -i "dist/texe_${{ needs.metadata.outputs.version }}_amd64.deb"
          for command in texe pqty pqty-fls; do
            "/usr/bin/$command" --version
          done

      - name: Test macOS downloaded installer
        if: matrix.platform == 'aarch64-macos'
        shell: bash
        run: |
          (cd dist && shasum -a 256 "${{ matrix.archive }}" > SHA256SUMS)
          prefix="$RUNNER_TEMP/texe-installed"
          python3 -m http.server 38479 \
            --bind 127.0.0.1 \
            --directory dist >"$RUNNER_TEMP/texe-installer-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            curl --fail --silent http://127.0.0.1:38479/${{ matrix.archive }} \
              --output /dev/null && break
            sleep 0.25
          done
          TEXE_RELEASE_BASE_URL=http://127.0.0.1:38479 \
          TEXE_INSTALL_TEST_ALLOW_HTTP=1 \
            ./scripts/install-macos.sh --prefix "$prefix"
          for command in texe pqty pqty-fls; do
            "$prefix/bin/$command" --version
          done
          ./scripts/uninstall.sh --prefix "$prefix"
          for command in texe pqty pqty-fls; do
            test ! -e "$prefix/bin/$command"
          done
          rm dist/SHA256SUMS

      - name: Test Windows user-local installer
        if: matrix.platform == 'x86_64-windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "texe-installed"
          ./scripts/install.ps1 `
            -From "dist/${{ matrix.archive }}" `
            -Prefix $prefix
          foreach ($command in "texe", "pqty", "pqty-fls") {
            & (Join-Path $prefix "bin/$command.exe") --version
            if ($LASTEXITCODE -ne 0) { throw "$command smoke test failed" }
          }
          ./scripts/uninstall.ps1 -Prefix $prefix
          foreach ($command in "texe", "pqty", "pqty-fls") {
            if (Test-Path -LiteralPath (Join-Path $prefix "bin/$command.exe")) {
              throw "$command was not removed"
            }
          }
          $bin = Join-Path $prefix "bin"
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (@($userPath -split ';' | Where-Object { $_ }) -contains $bin) {
            throw "installer PATH entry was not removed"
          }

      - name: Render Homebrew formula
        if: matrix.platform == 'aarch64-macos'
        shell: bash
        run: |
          digest="$(shasum -a 256 "dist/${{ matrix.archive }}" | awk '{print $1}')"
          cargo xtask render homebrew \
            --version "${{ needs.metadata.outputs.version }}" \
            --sha256 "$digest" \
            --output dist/texe.rb
          ruby -c dist/texe.rb
          ! grep -q '@VERSION@\|@SHA256@' dist/texe.rb

      - name: Render WinGet submission
        if: matrix.platform == 'x86_64-windows'
        shell: pwsh
        run: |
          $digest = (Get-FileHash "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash
          cargo xtask render winget `
            --version "${{ needs.metadata.outputs.version }}" `
            --sha256 "$digest" `
            --output "$env:RUNNER_TEMP/winget"
          if (Select-String -Path "$env:RUNNER_TEMP/winget/*.yaml" -Pattern '@VERSION@|@SHA256@') {
            throw "unrendered WinGet placeholder"
          }
          Compress-Archive `
            -Path "$env:RUNNER_TEMP/winget/*.yaml" `
            -DestinationPath "dist/winget-Backmatter.Texe-${{ needs.metadata.outputs.version }}.zip"

      - name: Attest portable archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/${{ matrix.archive }}

      - name: Attest Linux package
        if: matrix.platform == 'x86_64-linux'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/texe_${{ needs.metadata.outputs.version }}_amd64.deb

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  crates:
    name: Publish crate
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - metadata
      - suite
    runs-on: ubuntu-24.04
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish texe
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        shell: bash
        run: |
          version="${{ needs.metadata.outputs.version }}"
          endpoint="https://crates.io/api/v1/crates/texe/$version"
          status="$(
            curl --silent --show-error \
              --user-agent "texe-release/$version" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$endpoint"
          )"
          case "$status" in
            200) echo "texe $version already exists; skipping" ;;
            404) cargo publish --package texe --locked ;;
            *)
              echo "crates.io returned HTTP $status for texe $version" >&2
              exit 1
              ;;
          esac

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - metadata
      - suite
      - crates
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: suite-*
          merge-multiple: true

      - name: Add installers and aggregate checksum
        shell: bash
        run: |
          cp scripts/install.sh dist/install-linux.sh
          cp scripts/install-macos.sh dist/install-macos.sh
          cp scripts/install.ps1 dist/install-windows.ps1
          cp scripts/uninstall.sh dist/uninstall-unix.sh
          cp scripts/uninstall.ps1 dist/uninstall-windows.ps1
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Attest all release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*

      - name: Upload assets and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.metadata.outputs.tag }}" dist/* --clobber
          gh release edit "${{ needs.metadata.outputs.tag }}" --draft=false --latest
