[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "texe"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Create, build, and work on a LaTeX paper"
readme = "README.md"
documentation = "https://docs.rs/texe"
homepage = "https://github.com/backmatter/texe"
repository = "https://github.com/backmatter/texe"
keywords = ["latex", "tex", "toolchain", "build", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "src/**",
    "tests/**",
    "assets/pdfjs/pdfjs-5.7.284-dist.zip",
    "assets/pdfjs/LICENSE",
    "assets/vscode-extension/**",
    "docs/**",
    "schemas/**",
    "toolchains/**",
    "build.rs",
    "suite.lock.toml",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/Cargo.lock",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cliclack = "0.5.5"
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tar = "0.4"
thiserror = "2"
toml = "1.1"
ureq = "3"
xz2 = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
