[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
toml = "1.1"
ureq = "3.3"
xz2 = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
